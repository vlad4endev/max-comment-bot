<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Вход — CommentBot SuperAdmin</title>
  <link rel="icon" href="/admin/assets/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/admin/assets/admin.css" />
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 1.5rem; }
    .login-wrap { width: 100%; max-width: 400px; }
    .login-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 2rem; }
    .login-card h1 { margin: 0 0 0.35rem; font-size: 1.35rem; }
    .login-card p { color: var(--text-secondary); margin: 0 0 1.25rem; font-size: 0.92rem; line-height: 1.45; }
    .login-error { color: var(--danger); font-size: 0.85rem; min-height: 1.2em; margin-top: 0.75rem; }
    label { display: block; font-size: 0.78rem; color: var(--text-secondary); margin-bottom: 0.35rem; }
    input { width: 100%; margin-bottom: 0.85rem; }
    .brand-row { display: flex; align-items: center; gap: 0.65rem; margin-bottom: 1.25rem; }
    .brand-row span { font-size: 1.75rem; }
  </style>
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <div class="brand-row">
        <span>💬</span>
        <div>
          <strong style="display:block;font-size:1.1rem;">CommentBot</strong>
          <span class="muted" style="font-size:0.8rem;">SuperAdmin</span>
        </div>
      </div>
      <h1>Вход в панель</h1>
      <p>Учётные данные из переменных <span class="mono">ADMIN_PANEL_USER</span> и <span class="mono">ADMIN_PANEL_PASSWORD</span>.</p>
      <form id="loginForm">
        <label for="username">Логин</label>
        <input type="text" id="username" name="username" autocomplete="username" required />
        <label for="password">Пароль</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required />
        <button type="submit" class="btn btn-primary" style="width:100%;margin-top:0.5rem;">Войти</button>
      </form>
      <p id="loginError" class="login-error" role="alert"></p>
    </div>
  </div>
  <script>
    document.getElementById('loginForm').addEventListener('submit', function (e) {
      e.preventDefault();
      var err = document.getElementById('loginError');
      err.textContent = '';
      fetch('/api/admin/panel-login', {
        method: 'POST',
        credentials: 'same-origin',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          username: document.getElementById('username').value.trim(),
          password: document.getElementById('password').value,
        }),
      })
        .then(function (r) {
          if (!r.ok) throw new Error('Неверный логин или пароль');
          window.location.href = '/admin#dashboard';
        })
        .catch(function (ex) {
          err.textContent = ex.message || 'Ошибка входа';
        });
    });
  </script>
</body>
</html>
