<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Вход — CommentBot</title>
  <link rel="icon" href="/admin/assets/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/admin/assets/admin.css?v=20260806-light-v1" />
</head>
<body class="login-page">
  <div class="login-wrap">
    <div class="login-card">
      <div class="login-brand">
        <span class="login-brand-icon" aria-hidden="true">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </span>
        <div>
          <span class="login-brand-title">CommentBot</span>
          <span class="login-brand-sub">Панель управления</span>
        </div>
      </div>
      <h1>С возвращением</h1>
      <p class="login-lead">Войдите, чтобы управлять каналами, комментариями и мостами Telegram → MAX.</p>
      <form id="loginForm">
        <div class="login-field">
          <label for="username">Логин</label>
          <input type="text" id="username" name="username" autocomplete="username" required placeholder="admin" />
        </div>
        <div class="login-field">
          <label for="password">Пароль</label>
          <input type="password" id="password" name="password" autocomplete="current-password" required placeholder="••••••••" />
        </div>
        <button type="submit" class="btn btn-primary btn-block" style="margin-top:0.35rem;padding:0.7rem 1rem;font-size:0.9rem;">Войти в панель</button>
      </form>
      <p id="loginError" class="login-error" role="alert"></p>
      <p class="login-hint">Учётные данные задаются переменными окружения <span class="mono">ADMIN_PANEL_USER</span> и <span class="mono">ADMIN_PANEL_PASSWORD</span>.</p>
    </div>
  </div>
  <script>
    document.getElementById('loginForm').addEventListener('submit', function (e) {
      e.preventDefault();
      var err = document.getElementById('loginError');
      var btn = e.target.querySelector('button[type="submit"]');
      err.textContent = '';
      btn.disabled = true;
      btn.textContent = 'Вход…';
      fetch('/api/admin/panel-login', {
        method: 'POST',
        credentials: 'same-origin',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          username: document.getElementById('username').value.trim(),
          password: document.getElementById('password').value,
        }),
      })
        .then(function (r) {
          if (!r.ok) throw new Error('Неверный логин или пароль');
          window.location.href = '/admin#dashboard';
        })
        .catch(function (ex) {
          err.textContent = ex.message || 'Ошибка входа';
          btn.disabled = false;
          btn.textContent = 'Войти в панель';
        });
    });
  </script>
</body>
</html>
