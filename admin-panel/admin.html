<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-store" />
  <title>CommentBot — Панель управления</title>
  <link rel="icon" href="/admin/assets/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/admin/assets/admin.css?v=20260619-chains1" />
  <link rel="stylesheet" href="/admin/assets/autoposts.css?v=20260619-platform-v5" />
</head>
<body>
  <div id="sidebarOverlay" class="sidebar-overlay" aria-hidden="true"></div>

  <div id="app" class="app hidden">
    <aside class="sidebar" id="sidebar" aria-label="Основное меню">
      <div class="sidebar-brand">
        <span class="brand-icon" aria-hidden="true">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </span>
        <div>
          <div class="brand-title">CommentBot</div>
          <div class="brand-sub">Панель управления</div>
        </div>
      </div>
      <nav class="sidebar-nav" id="sidebarNav"></nav>
      <div class="sidebar-footer">
        <div class="bot-status" id="botStatus">
          <span class="status-dot" aria-hidden="true"></span>
          <div class="bot-status-lines">
            <span class="bot-status-label">Проверка статуса…</span>
            <span class="bot-status-sub"></span>
          </div>
        </div>
        <button type="button" class="btn btn-ghost btn-block btn-sm" id="logoutBtn">
          <i data-lucide="log-out"></i>
          Выйти
        </button>
      </div>
    </aside>

    <div class="main-wrap">
      <header class="topbar">
        <button type="button" class="sidebar-toggle" id="sidebarToggle" aria-label="Открыть меню">
          <i data-lucide="menu"></i>
        </button>
        <div class="page-header">
          <nav class="breadcrumb" id="pageBreadcrumb" aria-label="Текущий раздел"></nav>
          <h1 class="topbar-title" id="pageTitle">Дашборд</h1>
          <p class="page-subtitle" id="pageSubtitle"></p>
        </div>
        <div class="topbar-actions" id="topbarActions"></div>
      </header>
      <main class="content" id="mainContent"></main>
    </div>
  </div>

  <div id="modalRoot"></div>
  <div id="toastRoot" class="toast-root"></div>

  <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
  <script src="/admin/assets/ap-text-editor.js?v=20260619-platform-v5"></script>
  <script src="/admin/assets/autoposts.js?v=20260619-platform-v5"></script>
  <script src="/admin/assets/admin.js?v=20260619-chains1"></script>
</body>
</html>
