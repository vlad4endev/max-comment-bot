<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CommentBot — Панель управления</title>
  <script>
    (function() {
      var STORAGE_KEY = 'commentbot_theme'

      function getSystemTheme() {
        return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
      }

      function getEffectiveTheme(pref) {
        if (pref === 'auto' || !pref) return getSystemTheme()
        return pref
      }

      function getStoredPref() {
        try { return localStorage.getItem(STORAGE_KEY) || 'auto' } catch (e) { return 'auto' }
      }

      function applyTheme(pref) {
        var safePref = (pref === 'light' || pref === 'dark' || pref === 'auto') ? pref : 'auto'
        var effective = getEffectiveTheme(safePref)
        document.documentElement.setAttribute('data-theme', effective)
        try { localStorage.setItem(STORAGE_KEY, safePref) } catch (e) {}
      }

      applyTheme(getStoredPref())

      var media = window.matchMedia('(prefers-color-scheme: dark)')
      if (typeof media.addEventListener === 'function') {
        media.addEventListener('change', function() {
          if (getStoredPref() === 'auto') applyTheme('auto')
        })
      } else if (typeof media.addListener === 'function') {
        media.addListener(function() {
          if (getStoredPref() === 'auto') applyTheme('auto')
        })
      }

      window.ThemeManager = {
        set: function(pref) { applyTheme(pref) },
        get: function() { return getStoredPref() },
        getEffective: function() { return getEffectiveTheme(getStoredPref()) }
      }
    })()
  </script>
  <style>
    :root {
      --bg-primary: #0d0d18;
      --bg-secondary: #161625;
      --bg-surface: rgba(255,255,255,0.04);
      --bg-surface-hover: rgba(255,255,255,0.07);

      --text-primary: rgba(255,255,255,0.92);
      --text-secondary: rgba(255,255,255,0.55);
      --text-muted: rgba(255,255,255,0.3);
      --text-on-accent: #ffffff;

      --border: rgba(255,255,255,0.08);
      --border-strong: rgba(255,255,255,0.15);

      --accent: #7F77DD;
      --accent-bg: rgba(127,119,221,0.12);
      --accent-border: rgba(127,119,221,0.25);
      --teal: #5DCAA5;
      --teal-bg: rgba(93,202,165,0.12);

      --danger: #ff8a80;
      --warning: #EF9F27;
      --warning-bg: rgba(239,159,39,0.2);
      --success: #5DCAA5;
      --info: #5ecfff;
      --info-bg: rgba(94,207,255,0.2);

      --bubble-user: rgba(255,255,255,0.06);
      --bubble-admin: rgba(127,119,221,0.10);
      --bubble-admin-border: rgba(127,119,221,0.20);

      --input-bg: rgba(255,255,255,0.06);
      --input-border: rgba(255,255,255,0.10);

      --send-bg: #7F77DD;
      --accent-soft-text: #c4bfff;
      --panel-danger-border: rgba(255,138,128,0.45);

      --bg: var(--bg-primary);
      --bg2: var(--bg-secondary);
      --surface: var(--bg-surface);
      --text: var(--text-primary);
      --muted: var(--text-secondary);
      --accent-dim: var(--accent-bg);
      --radius: 12px;
      --font: 'Inter', system-ui, -apple-system, Segoe UI, sans-serif;
    }
    [data-theme="light"] {
      --bg-primary: #f5f5f7;
      --bg-secondary: #ffffff;
      --bg-surface: rgba(0,0,0,0.04);
      --bg-surface-hover: rgba(0,0,0,0.07);

      --text-primary: rgba(0,0,0,0.88);
      --text-secondary: rgba(0,0,0,0.55);
      --text-muted: rgba(0,0,0,0.35);
      --text-on-accent: #ffffff;

      --border: rgba(0,0,0,0.08);
      --border-strong: rgba(0,0,0,0.15);

      --accent: #6C64CC;
      --accent-bg: rgba(108,100,204,0.10);
      --accent-border: rgba(108,100,204,0.25);
      --teal: #1D9E75;
      --teal-bg: rgba(29,158,117,0.10);

      --danger: #E53935;
      --warning: #F57C00;
      --warning-bg: rgba(245,124,0,0.16);
      --success: #1D9E75;
      --info: #0277bd;
      --info-bg: rgba(2,119,189,0.16);

      --bubble-user: rgba(0,0,0,0.05);
      --bubble-admin: rgba(108,100,204,0.08);
      --bubble-admin-border: rgba(108,100,204,0.20);

      --input-bg: rgba(0,0,0,0.05);
      --input-border: rgba(0,0,0,0.12);
      --send-bg: #6C64CC;
      --accent-soft-text: #7e76cf;
      --panel-danger-border: rgba(229,57,53,0.4);
    }
    [data-theme="dark"] {}
    * { box-sizing: border-box; }
    *, *::before, *::after {
      transition: background-color 0.2s ease, border-color 0.2s ease, color 0.2s ease;
    }
    .no-transition,
    input, textarea, button {
      transition: none;
    }
    body { margin: 0; font-family: var(--font); background: var(--bg); color: var(--text); min-height: 100vh; }
    a { color: var(--accent); }

    .login-screen {
      min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1.5rem;
    }
    .login-card {
      width: 100%; max-width: 400px; background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 2rem;
    }
    .login-card h1 { margin: 0 0 0.5rem; font-size: 1.35rem; }
    .login-card p { color: var(--muted); margin: 0 0 1.25rem; font-size: 0.95rem; line-height: 1.45; }
    label { display: block; font-size: 0.8rem; color: var(--muted); margin-bottom: 0.35rem; }
    input[type="text"], input[type="number"], input[type="password"], select {
      width: 100%; padding: 0.65rem 0.85rem; border-radius: 8px; border: 1px solid var(--border);
      background: var(--bg2); color: var(--text); font-size: 1rem;
    }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 0.35rem;
      padding: 0.55rem 1rem; border-radius: 8px; border: none; font-weight: 600; font-size: 0.9rem;
      cursor: pointer; font-family: inherit;
    }
    .btn-primary { background: var(--accent); color: var(--text-on-accent); }
    .btn-primary:hover { filter: brightness(1.08); }
    .btn-ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); }
    .btn-danger { background: var(--danger); color: var(--text-on-accent); }
    .btn-sm { padding: 0.35rem 0.65rem; font-size: 0.8rem; }
    .login-error { color: var(--danger); font-size: 0.85rem; margin-top: 0.75rem; min-height: 1.2em; }

    .app-shell { display: flex; min-height: 100vh; }
    .sidebar {
      width: 260px; flex-shrink: 0; background: var(--bg2); border-right: 1px solid var(--border);
      display: flex; flex-direction: column; padding: 1.25rem 0;
    }
    .brand { padding: 0 1.25rem 1.5rem; border-bottom: 1px solid var(--border); margin-bottom: 0.5rem; }
    .brand-logo { font-size: 1.5rem; line-height: 1; }
    .brand-sub { font-size: 0.78rem; color: var(--muted); margin-top: 0.35rem; letter-spacing: 0.02em; }
    .nav-btn {
      display: flex; align-items: center; gap: 0.6rem; width: 100%; text-align: left;
      padding: 0.65rem 1.25rem; border: none; background: transparent; color: var(--muted);
      font-size: 0.92rem; cursor: pointer; font-family: inherit; border-left: 3px solid transparent;
    }
    .nav-btn:hover { color: var(--text); background: var(--accent-dim); }
    .nav-btn.active { color: var(--text); border-left-color: var(--accent); background: var(--accent-dim); }
    .owner-card {
      margin-top: auto; padding: 1rem 1.25rem; border-top: 1px solid var(--border);
      display: flex; align-items: center; gap: 0.75rem;
    }
    .owner-avatar {
      width: 40px; height: 40px; border-radius: 50%; background: var(--accent); color: var(--text-on-accent);
      display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 0.85rem;
    }
    .owner-meta { font-size: 0.8rem; color: var(--muted); }
    .owner-meta strong { display: block; color: var(--text); font-size: 0.9rem; }

    .main { flex: 1; padding: 1.5rem 2rem; overflow: auto; }
    .page-title { font-size: 1.5rem; margin: 0 0 1.25rem; font-weight: 700; }

    .stats-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 1rem; margin-bottom: 1.5rem; }
    .stat-card {
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.1rem;
    }
    .stat-card .label { font-size: 0.78rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
    .stat-card .value { font-size: 1.75rem; font-weight: 700; margin-top: 0.25rem; color: var(--accent); }

    .panel {
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 1rem; margin-bottom: 1.25rem;
    }
    .panel h2 { margin: 0 0 0.75rem; font-size: 1rem; color: var(--muted); font-weight: 600; }

    table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
    th, td { text-align: left; padding: 0.6rem 0.5rem; border-bottom: 1px solid var(--border); }
    th { color: var(--muted); font-weight: 600; font-size: 0.75rem; text-transform: uppercase; }
    tr:last-child td { border-bottom: none; }

    .badge { display: inline-block; padding: 0.2rem 0.5rem; border-radius: 6px; font-size: 0.72rem; font-weight: 600; }
    .badge-active { background: var(--teal-bg); color: var(--success); }
    .badge-pending { background: var(--warning-bg); color: var(--warning); }
    .badge-owner { background: var(--accent-border); color: var(--accent); }
    .badge-admin { background: var(--info-bg); color: var(--info); }
    .badge-sub { background: var(--accent-dim); color: var(--accent-soft-text); }

    .activity-item { padding: 0.65rem 0; border-bottom: 1px solid var(--border); font-size: 0.88rem; }
    .activity-item:last-child { border-bottom: none; }
    .activity-type { font-weight: 600; color: var(--accent); }
    .activity-time { color: var(--muted); font-size: 0.78rem; }

    .toolbar { display: flex; flex-wrap: wrap; gap: 0.75rem; margin-bottom: 1rem; align-items: center; }
    .user-cell { display: flex; align-items: center; gap: 0.5rem; }
    .avatar-placeholder {
      width: 32px; height: 32px; border-radius: 50%; background: var(--border); color: var(--text);
      display: flex; align-items: center; justify-content: center; font-size: 0.65rem; font-weight: 700;
    }

    .log-box {
      font-family: ui-monospace, monospace; font-size: 0.78rem; background: var(--bg); padding: 0.75rem;
      border-radius: 8px; max-height: 420px; overflow: auto; white-space: pre-wrap; word-break: break-all;
    }
    .danger-zone { border-color: var(--panel-danger-border); }
    .muted { color: var(--muted); }

    .hidden { display: none !important; }
    .main-header {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      margin-bottom: 0.9rem;
    }
    .theme-toggle-btn {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 6px 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--text-secondary);
      font-size: 12px;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div id="appShell" class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-logo">💬 CommentBot</div>
        <div class="brand-sub">Панель управления</div>
      </div>
      <button type="button" class="nav-btn active" data-tab="overview">Обзор</button>
      <button type="button" class="nav-btn" data-tab="channels">Каналы</button>
      <button type="button" class="nav-btn" data-tab="users">Пользователи</button>
      <button type="button" class="nav-btn" data-tab="comments">Комментарии</button>
      <button type="button" class="nav-btn" data-tab="settings">Настройки</button>
      <button type="button" class="nav-btn" data-tab="logs">Логи</button>
      <div class="owner-card">
        <div class="owner-avatar" id="ownerAvatar">?</div>
        <div class="owner-meta">
          <strong>Панель</strong>
          <span id="ownerIdLabel">—</span>
        </div>
      </div>
      <div style="padding: 0 1.25rem 1rem;">
        <button type="button" class="btn btn-ghost btn-sm" id="logoutBtn" style="width:100%;">Выйти</button>
      </div>
    </aside>
    <main class="main">
      <div class="main-header">
        <button id="themeToggle" class="theme-toggle-btn no-transition" type="button" onclick="cycleTheme()">
          <span id="themeIcon">🌙</span>
          <span id="themeLabel">Авто</span>
        </button>
      </div>
      <section id="page-overview" class="page">
        <h1 class="page-title">Обзор</h1>
        <div class="stats-grid" id="overviewStats"></div>
        <div class="panel">
          <h2>Каналы</h2>
          <div id="overviewChannels"></div>
        </div>
        <div class="panel">
          <h2>Последняя активность</h2>
          <div id="overviewActivity"></div>
        </div>
      </section>

      <section id="page-channels" class="page hidden">
        <h1 class="page-title">Каналы</h1>
        <div class="panel" id="channelsTableWrap"></div>
      </section>

      <section id="page-users" class="page hidden">
        <h1 class="page-title">Пользователи</h1>
        <div class="toolbar">
          <input type="search" id="userSearch" placeholder="Поиск по имени или ID…" style="max-width:260px;" />
          <select id="userRoleFilter">
            <option value="all">Все</option>
            <option value="owner">Владелец</option>
            <option value="admin">Админ</option>
            <option value="subscriber">Подписчик</option>
          </select>
        </div>
        <div class="panel" id="usersTableWrap"></div>
      </section>

      <section id="page-comments" class="page hidden">
        <h1 class="page-title">Комментарии</h1>
        <div class="toolbar">
          <select id="commentsChannelSelect"><option value="">— Канал —</option></select>
          <input type="search" id="commentsSearch" placeholder="Поиск по тексту…" style="max-width:260px;" />
        </div>
        <div class="panel" id="commentsTableWrap"></div>
      </section>

      <section id="page-settings" class="page hidden">
        <h1 class="page-title">Настройки</h1>
        <div class="panel">
          <h2>Бот</h2>
          <p class="muted">BOT_NICKNAME: <strong id="setNickname">—</strong></p>
          <p class="muted">MINI_APP_URL: <strong id="setMiniUrl">—</strong></p>
          <p style="margin-top:1rem;">
            <label>Интервал опроса каналов (сек)</label>
            <input type="number" id="pollIntervalInput" min="3" step="1" style="max-width:120px;" />
            <button type="button" class="btn btn-primary btn-sm" id="savePollBtn" style="margin-left:0.5rem;">Сохранить</button>
          </p>
        </div>
        <div class="panel danger-zone">
          <h2>Опасная зона</h2>
          <p class="muted">Необратимые действия с локальными данными.</p>
          <button type="button" class="btn btn-danger btn-sm" id="resetPostsBtn">Сбросить все посты</button>
          <button type="button" class="btn btn-danger btn-sm" id="resetSubsBtn" style="margin-left:0.5rem;">Сбросить подписчиков</button>
        </div>
      </section>

      <section id="page-logs" class="page hidden">
        <h1 class="page-title">Логи</h1>
        <div class="toolbar">
          <label>Уровень</label>
          <select id="logLevelFilter">
            <option value="">Все</option>
            <option value="INFO">INFO</option>
            <option value="WARN">WARN</option>
            <option value="ERROR">ERROR</option>
          </select>
        </div>
        <div class="panel">
          <div class="log-box" id="logOutput"></div>
        </div>
      </section>
    </main>
  </div>

  <script>
(function () {
  function updateToggleUI() {
    var pref = window.ThemeManager.get()
    var icons = { auto: '✨', light: '☀️', dark: '🌙' }
    var labels = { auto: 'Авто', light: 'Светлая', dark: 'Тёмная' }
    document.getElementById('themeIcon').textContent = icons[pref] || '✨'
    document.getElementById('themeLabel').textContent = labels[pref] || 'Авто'
  }

  window.cycleTheme = function cycleTheme() {
    var order = ['auto', 'light', 'dark']
    var current = window.ThemeManager.get()
    var next = order[(order.indexOf(current) + 1) % order.length]
    window.ThemeManager.set(next)
    updateToggleUI()
  }

  updateToggleUI()

  function qs(sel) { return document.querySelector(sel) }

  function handleAuth(r) {
    if (r.status === 403) {
      window.location.href = '/admin/login'
      throw new Error('auth')
    }
    return r
  }

  function apiPath(suffix) {
    return '/api/admin' + suffix
  }

  function authFetch(path, opts) {
    opts = opts || {}
    opts.credentials = 'same-origin'
    opts.headers = opts.headers || {}
    if (!opts.headers['Content-Type'] && opts.body && typeof opts.body === 'string') {
      opts.headers['Content-Type'] = 'application/json'
    }
    return fetch(apiPath(path), opts).then(handleAuth)
  }

  function updateSidebarProfile(d) {
    var u = (d && d.admin_panel_user) ? String(d.admin_panel_user) : '—'
    qs('#ownerIdLabel').textContent = u
    qs('#ownerAvatar').textContent = u.length >= 2 ? u.slice(0, 2).toUpperCase() : (u === '—' ? '?' : u.charAt(0).toUpperCase())
  }

  fetch(apiPath('/settings'), { credentials: 'same-origin' })
    .then(handleAuth)
    .then(function (r) { return r.json() })
    .then(updateSidebarProfile)
    .catch(function () {})

  qs('#logoutBtn').addEventListener('click', function () {
    fetch(apiPath('/panel-logout'), { method: 'POST', credentials: 'same-origin' }).then(function () {
      window.location.href = '/admin/login'
    })
  })

  function activateTab(name) {
    document.querySelectorAll('.nav-btn').forEach(function (b) {
      b.classList.toggle('active', b.getAttribute('data-tab') === name)
    })
    document.querySelectorAll('.page').forEach(function (p) { p.classList.add('hidden') })
    var page = qs('#page-' + name)
    if (page) page.classList.remove('hidden')
    if (name === 'overview') loadOverview()
    if (name === 'channels') loadChannelsPage()
    if (name === 'users') loadUsersPage()
    if (name === 'comments') loadCommentsPage()
    if (name === 'settings') loadSettingsPage()
    if (name === 'logs') startLogs()
  }

  document.querySelectorAll('.nav-btn').forEach(function (btn) {
    btn.addEventListener('click', function () {
      activateTab(btn.getAttribute('data-tab'))
    })
  })

  activateTab('overview')

  function esc(s) {
    if (s == null) return ''
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
  }

  function truncate(s, n) {
    s = String(s || '')
    if (s.length <= n) return s
    return s.slice(0, n) + '…'
  }

  function loadOverview() {
    fetch(apiPath('/stats'), { credentials: 'same-origin' })
      .then(handleAuth)
      .then(function (r) { return r.json() })
      .then(function (d) {
        qs('#overviewStats').innerHTML =
          '<div class="stat-card"><div class="label">Каналов</div><div class="value">' + esc(d.channel_count) + '</div></div>' +
          '<div class="stat-card"><div class="label">Подписчиков</div><div class="value">' + esc(d.bot_subscribers) + '</div></div>' +
          '<div class="stat-card"><div class="label">Комментариев</div><div class="value">' + esc(d.comment_count) + '</div></div>' +
          '<div class="stat-card"><div class="label">Постов</div><div class="value">' + esc(d.post_count) + '</div></div>'
      })
    fetch(apiPath('/channels'), { credentials: 'same-origin' })
      .then(handleAuth)
      .then(function (r) { return r.json() })
      .then(function (d) {
        var rows = (d.channels || []).map(function (c) {
          var st = c.status === 'pending' ? '<span class="badge badge-pending">Ожидает</span>' : '<span class="badge badge-active">Активен</span>'
          return '<tr><td>' + esc(c.title || '—') + '</td><td>' + esc(c.subscribers != null ? c.subscribers : '—') + '</td><td>' + esc(c.post_count) + '</td><td>' + st + '</td></tr>'
        }).join('')
        qs('#overviewChannels').innerHTML =
          '<table><thead><tr><th>Канал</th><th>Подписчики</th><th>Постов</th><th>Статус</th></tr></thead><tbody>' +
          (rows || '<tr><td colspan="4" class="muted">Нет каналов</td></tr>') +
          '</tbody></table>'
      })
    fetch(apiPath('/activity'), { credentials: 'same-origin' })
      .then(handleAuth)
      .then(function (r) { return r.json() })
      .then(function (d) {
        var labels = {
          new_subscriber: 'Новый подписчик',
          new_comment: 'Новый комментарий',
          new_post_button: 'Кнопка на посте',
          admin_reply: 'Ответ администратора',
          channel_added: 'Канал подключён',
        }
        var html = (d.events || []).map(function (ev) {
          return '<div class="activity-item"><span class="activity-type">' + esc(labels[ev.type] || ev.type) + '</span>' +
            ' <span class="activity-time">' + esc(ev.timestamp) + '</span><div class="muted" style="margin-top:0.25rem;">' +
            esc(JSON.stringify(ev.payload)) + '</div></div>'
        }).join('')
        qs('#overviewActivity').innerHTML = html || '<p class="muted">Нет событий</p>'
      })
  }

  function loadChannelsPage() {
    fetch(apiPath('/channels'), { credentials: 'same-origin' })
      .then(handleAuth)
      .then(function (r) { return r.json() })
      .then(function (d) {
        var body = (d.channels || []).map(function (c) {
          var st = c.status === 'pending'
            ? '<span class="badge badge-pending">Ожидает</span>'
            : '<span class="badge badge-active">Активен</span>'
          return '<tr><td>' + esc(c.title || '—') + '</td><td>' + esc(c.chat_id) + '</td><td>' + esc(c.subscribers != null ? c.subscribers : '—') +
            '</td><td>' + esc(c.post_count) + '</td><td>' + esc(c.comment_count) + '</td><td>' + esc(c.date_added) + '</td><td>' + st + '</td><td>' +
            '<button type="button" class="btn btn-ghost btn-sm ch-remove" data-id="' + esc(c.chat_id) + '">Отключить</button> ' +
            '<button type="button" class="btn btn-primary btn-sm ch-refresh" data-id="' + esc(c.chat_id) + '">Обновить кнопки</button></td></tr>'
        }).join('')
        qs('#channelsTableWrap').innerHTML =
          '<table><thead><tr><th>Название</th><th>chat_id</th><th>Подписчики</th><th>Постов</th><th>Комментариев</th><th>Дата подключения</th><th>Статус</th><th></th></tr></thead><tbody>' +
          (body || '<tr><td colspan="8" class="muted">Нет данных</td></tr>') + '</tbody></table>'
        bindChannelActions()
      })
  }

  function bindChannelActions() {
    qs('#channelsTableWrap').onclick = function (e) {
      var t = e.target
      if (!t.getAttribute || !t.getAttribute('data-id')) return
      var id = Number(t.getAttribute('data-id'))
      if (t.classList.contains('ch-remove')) {
        if (!confirm('Отключить канал ' + id + ' и удалить связанные посты/комментарии в боте?')) return
        authFetch('/remove-channel', { method: 'POST', body: JSON.stringify({ chat_id: id }) })
          .then(function () { loadChannelsPage(); loadOverview() })
      }
      if (t.classList.contains('ch-refresh')) {
        authFetch('/refresh-buttons', { method: 'POST', body: JSON.stringify({ chat_id: id }) })
          .then(function (r) {
            if (!r.ok) alert('Не удалось обновить')
            else alert('Опрос выполнен')
          })
      }
    }
  }

  function loadUsersPage() {
    fetch(apiPath('/users'), { credentials: 'same-origin' })
      .then(handleAuth)
      .then(function (r) { return r.json() })
      .then(function (d) {
        window.__usersCache = d.users || []
        renderUsers()
      })
  }

  function renderUsers() {
    var q = (qs('#userSearch').value || '').toLowerCase()
    var rf = qs('#userRoleFilter').value
    var list = (window.__usersCache || []).filter(function (u) {
      if (rf !== 'all' && u.role !== rf) return false
      if (!q) return true
      return String(u.user_id).includes(q) || String(u.name || '').toLowerCase().includes(q)
    })
    var body = list.map(function (u) {
      var badge = u.role === 'owner' ? 'badge-owner' : u.role === 'admin' ? 'badge-admin' : 'badge-sub'
      var label = u.role === 'owner' ? 'Владелец' : u.role === 'admin' ? 'Админ' : 'Подписчик'
      var ch = (u.channels || []).map(function (x) { return esc(x.title || x.chat_id) }).join(', ')
      var nm = u.name || 'Неизвестный'
      var ini = nm.split(/\s+/).map(function (x) { return x.charAt(0) }).join('').slice(0, 2).toUpperCase() || '?'
      var del = u.role === 'owner' ? '' : '<button type="button" class="btn btn-danger btn-sm u-del" data-id="' + esc(u.user_id) + '">Удалить</button>'
      return '<tr><td><div class="user-cell"><div class="avatar-placeholder">' + esc(ini) + '</div><div>' + esc(nm) + '</div></div></td><td>' +
        esc(u.user_id) + '</td><td><span class="badge ' + badge + '">' + label + '</span></td><td>' + esc(ch || '—') + '</td><td>' + esc(u.registered_at || '—') + '</td><td>' + del + '</td></tr>'
    }).join('')
    qs('#usersTableWrap').innerHTML =
      '<table><thead><tr><th>Пользователь</th><th>user_id</th><th>Роль</th><th>Каналы</th><th>Дата регистрации</th><th></th></tr></thead><tbody>' +
      (body || '<tr><td colspan="6" class="muted">Нет данных</td></tr>') + '</tbody></table>'
    qs('#usersTableWrap').onclick = function (e) {
      var t = e.target
      if (!t.classList || !t.classList.contains('u-del')) return
      var id = Number(t.getAttribute('data-id'))
      if (!confirm('Удалить пользователя ' + id + '?')) return
      authFetch('/users/remove', { method: 'POST', body: JSON.stringify({ user_id: id }) })
        .then(function () { loadUsersPage() })
    }
  }

  qs('#userSearch').addEventListener('input', function () { if (window.__usersCache) renderUsers() })
  qs('#userRoleFilter').addEventListener('change', function () { if (window.__usersCache) renderUsers() })

  function fillChannelDropdown() {
    fetch(apiPath('/channels'), { credentials: 'same-origin' })
      .then(handleAuth)
      .then(function (r) { return r.json() })
      .then(function (d) {
        var sel = qs('#commentsChannelSelect')
        var cur = sel.value
        sel.innerHTML = '<option value="">— Канал —</option>' +
          (d.channels || []).map(function (c) {
            return '<option value="' + esc(c.chat_id) + '">' + esc(c.title || c.chat_id) + '</option>'
          }).join('')
        if (cur) sel.value = cur
      })
  }

  function loadCommentsPage() {
    fillChannelDropdown()
    fetchComments()
  }

  function fetchComments() {
    var cid = qs('#commentsChannelSelect').value
    if (!cid) {
      qs('#commentsTableWrap').innerHTML = '<p class="muted">Выберите канал</p>'
      return
    }
    var q = qs('#commentsSearch').value.trim()
    var extra = 'chat_id=' + encodeURIComponent(cid) + (q ? '&q=' + encodeURIComponent(q) : '')
    fetch(apiPath('/comments?' + extra), { credentials: 'same-origin' })
      .then(handleAuth)
      .then(function (r) { return r.json() })
      .then(function (d) {
        var body = (d.comments || []).map(function (c) {
          var rep = c.reply ? esc(truncate(c.reply.text, 80)) : '—'
          return '<tr><td>' + esc(truncate(c.post_preview, 48)) + '</td><td>' + esc(c.username) + '</td><td>' + esc(truncate(c.text, 60)) +
            '</td><td>' + rep + '</td><td>' + esc(c.timestamp) + '</td><td><button type="button" class="btn btn-danger btn-sm c-del" data-id="' + esc(c.comment_id) + '">Удалить</button></td></tr>'
        }).join('')
        qs('#commentsTableWrap').innerHTML =
          '<table><thead><tr><th>Пост</th><th>Пользователь</th><th>Комментарий</th><th>Ответ</th><th>Дата</th><th></th></tr></thead><tbody>' +
          (body || '<tr><td colspan="6" class="muted">Нет комментариев</td></tr>') + '</tbody></table>'
        qs('#commentsTableWrap').onclick = function (e) {
          var t = e.target
          if (!t.classList || !t.classList.contains('c-del')) return
          var id = t.getAttribute('data-id')
          if (!confirm('Удалить комментарий?')) return
          authFetch('/comments/delete', { method: 'POST', body: JSON.stringify({ comment_id: id }) })
            .then(function () { fetchComments() })
        }
      })
  }

  qs('#commentsChannelSelect').addEventListener('change', fetchComments)
  qs('#commentsSearch').addEventListener('input', function () { clearTimeout(window.__cSearchT); window.__cSearchT = setTimeout(fetchComments, 320) })

  function loadSettingsPage() {
    fetch(apiPath('/settings'), { credentials: 'same-origin' })
      .then(handleAuth)
      .then(function (r) { return r.json() })
      .then(function (d) {
        updateSidebarProfile(d)
        qs('#setNickname').textContent = d.bot_nickname || '—'
        qs('#setMiniUrl').textContent = d.mini_app_url || '(deep link через BOT_NICKNAME)'
        qs('#pollIntervalInput').value = String(Math.round(d.poll_interval_sec || 30))
      })
  }

  qs('#savePollBtn').addEventListener('click', function () {
    var sec = Number(qs('#pollIntervalInput').value)
    if (!sec || sec < 3) return alert('Минимум 3 секунды')
    authFetch('/settings', { method: 'POST', body: JSON.stringify({ poll_interval: sec }) })
      .then(function (r) { return r.json().then(function (j) { return { r: r, j: j } }) })
      .then(function (x) {
        if (!x.r.ok) alert(x.j.error || 'Ошибка')
        else alert('Сохранено: ' + x.j.poll_interval_sec + ' с')
      })
  })

  qs('#resetPostsBtn').addEventListener('click', function () {
    if (!confirm('Удалить ВСЕ посты и комментарии из JSON?')) return
    authFetch('/reset', { method: 'POST', body: JSON.stringify({ target: 'posts' }) })
      .then(function () { alert('Готово') })
  })
  qs('#resetSubsBtn').addEventListener('click', function () {
    if (!confirm('Очистить subscribers.json?')) return
    authFetch('/reset', { method: 'POST', body: JSON.stringify({ target: 'subscribers' }) })
      .then(function () { alert('Готово') })
  })

  var logsTimer
  function startLogs() {
    if (logsTimer) clearInterval(logsTimer)
    function tick() {
      var lv = qs('#logLevelFilter').value
      var path = lv ? '/logs?level=' + encodeURIComponent(lv) : '/logs'
      fetch(apiPath(path), { credentials: 'same-origin' })
        .then(handleAuth)
        .then(function (r) { return r.json() })
        .then(function (d) {
          qs('#logOutput').textContent = (d.lines || []).join('\n')
        })
    }
    tick()
    logsTimer = setInterval(tick, 5000)
  }
  qs('#logLevelFilter').addEventListener('change', function () {
    var lv = qs('#logLevelFilter').value
    var path = lv ? '/logs?level=' + encodeURIComponent(lv) : '/logs'
    fetch(apiPath(path), { credentials: 'same-origin' })
      .then(handleAuth)
      .then(function (r) { return r.json() })
      .then(function (d) { qs('#logOutput').textContent = (d.lines || []).join('\n') })
  })
})()
  </script>
</body>
</html>
