<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CommentBot — SuperAdmin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/admin/assets/admin.css" />
</head>
<body>
  <div id="app" class="app hidden">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand">
        <span class="brand-icon">💬</span>
        <div>
          <div class="brand-title">CommentBot</div>
          <div class="brand-sub">SuperAdmin</div>
        </div>
      </div>
      <nav class="sidebar-nav" id="sidebarNav"></nav>
      <div class="sidebar-footer">
        <div class="bot-status" id="botStatus">
          <span class="status-dot"></span>
          <span>Бот активен</span>
        </div>
        <button type="button" class="btn btn-ghost btn-block" id="logoutBtn">Выйти</button>
      </div>
    </aside>
    <div class="main-wrap">
      <header class="topbar">
        <h1 class="topbar-title" id="pageTitle">Дашборд</h1>
        <div class="topbar-actions" id="topbarActions"></div>
      </header>
      <main class="content" id="mainContent"></main>
    </div>
  </div>

  <div id="modalRoot"></div>
  <div id="toastRoot" class="toast-root"></div>

  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script src="/admin/assets/admin.js"></script>
</body>
</html>
