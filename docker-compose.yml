# Скопируйте config/.env.example в .env в корне проекта и задайте переменные.
# В production (NODE_ENV=production) по умолчанию режим webhook — нужны WEBHOOK_URL и WEBHOOK_SECRET
# (см. https://dev.max.ru/docs-api/methods/POST/subscriptions). Прокси с TLS :443 → этот контейнер;
# путь в WEBHOOK_URL должен совпадать с POST-маршрутом приложения.
# Локально без HTTPS: MAX_RECEIVE_MODE=polling в .env
# Данные: ./data → /app/data (posts.json, comments.json, channels.json)
# Сборка и запуск: docker compose up -d --build
# Логи: docker compose logs -f bot
services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save 60 1000 --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    image: max-comment-bot:latest
    restart: unless-stopped
    depends_on:
      - redis
    env_file:
      - .env
    environment:
      NODE_ENV: production
      REDIS_URL: redis://redis:6379
    volumes:
      - ./data:/app/data
    # HOST:PORT → контейнер слушает API_PORT (или PORT). Не смешивайте разные значения без правки проброса.
    ports:
      - "${PORT:-3000}:${API_PORT:-${PORT:-3000}}"
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS "http://127.0.0.1:${API_PORT:-${PORT:-3000}}/health" >/dev/null || exit 1']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 90s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

volumes:
  redis-data:
