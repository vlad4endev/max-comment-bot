<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Комментарии</title>
  <style>
    :root {
      --bg: #0f0f1a;
      --surface: rgba(255, 255, 255, 0.04);
      --surface-border: rgba(255, 255, 255, 0.08);
      --accent: #7f77dd;
      --teal: #5dcaa5;
      --admin-bubble: rgba(127, 119, 221, 0.12);
      --user-bubble: rgba(255, 255, 255, 0.06);
      --text: rgba(255, 255, 255, 0.92);
      --muted: rgba(255, 255, 255, 0.55);
      --danger: #ff8a80;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      -webkit-tap-highlight-color: transparent;
    }
    #app {
      display: flex;
      flex-direction: column;
      height: 100%;
      max-width: 100%;
      margin: 0 auto;
    }
    .header-wrap {
      flex: 0 0 auto;
      padding: 10px 12px 12px;
      padding-top: calc(10px + env(safe-area-inset-top));
      background: var(--bg);
      border-bottom: 1px solid var(--surface-border);
    }
    .channel-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }
    .channel-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      flex-shrink: 0;
      background: var(--accent);
      color: #fff;
      font-weight: 700;
      font-size: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .channel-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .channel-meta {
      flex: 1;
      min-width: 0;
    }
    .channel-name {
      font-size: 15px;
      font-weight: 600;
      line-height: 1.2;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .channel-subs {
      font-size: 12px;
      color: var(--muted);
      margin-top: 2px;
    }
    .count-badge {
      flex-shrink: 0;
      min-width: 28px;
      height: 28px;
      padding: 0 8px;
      border-radius: 14px;
      background: var(--accent);
      color: #fff;
      font-size: 12px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .post-preview {
      display: flex;
      gap: 10px;
      align-items: stretch;
      padding: 10px;
      background: var(--surface);
      border: 1px solid var(--surface-border);
      border-radius: 12px;
    }
    .post-preview-text {
      flex: 1;
      min-width: 0;
      font-size: 13px;
      line-height: 1.45;
      color: var(--muted);
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 3;
      overflow: hidden;
    }
    .post-thumb {
      width: 56px;
      height: 56px;
      border-radius: 8px;
      object-fit: cover;
      flex-shrink: 0;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--surface-border);
      display: none;
    }
    .post-thumb.show { display: block; }
    #feed {
      flex: 1 1 auto;
      overflow-y: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding-bottom: calc(88px + env(safe-area-inset-bottom));
    }
    .feed-empty {
      text-align: center;
      color: var(--muted);
      font-size: 14px;
      padding: 28px 12px;
    }
    .row-user {
      display: flex;
      flex-direction: row;
      align-items: flex-end;
      gap: 8px;
      align-self: flex-start;
      max-width: 100%;
    }
    .user-av {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      flex-shrink: 0;
      background: var(--accent);
      color: #fff;
      font-size: 13px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .user-av img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .bubble-user {
      max-width: min(268px, calc(100% - 44px));
      padding: 10px 12px;
      border-radius: 14px 14px 14px 4px;
      background: var(--user-bubble);
      border: 1px solid var(--surface-border);
    }
    .bubble-user .name {
      font-size: 13px;
      font-weight: 600;
      color: var(--teal);
      margin-bottom: 4px;
    }
    .bubble-user .text {
      font-size: 14px;
      line-height: 1.4;
      word-break: break-word;
      white-space: pre-wrap;
    }
    .bubble-user .time {
      font-size: 11px;
      color: var(--muted);
      margin-top: 6px;
    }
    .row-admin {
      align-self: flex-start;
      max-width: min(300px, 100%);
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }
    .bubble-admin {
      padding: 10px 12px;
      border-radius: 14px 14px 14px 4px;
      background: var(--admin-bubble);
      border: 1px solid rgba(127, 119, 221, 0.35);
    }
    .bubble-admin .tag {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: 0.02em;
      margin-bottom: 6px;
    }
    .bubble-admin .quote {
      font-size: 12px;
      color: var(--muted);
      padding: 8px 10px;
      margin-bottom: 8px;
      border-left: 3px solid var(--accent);
      background: rgba(0, 0, 0, 0.2);
      border-radius: 0 8px 8px 0;
      max-height: 4.2em;
      overflow: hidden;
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 3;
    }
    .bubble-admin .text {
      font-size: 14px;
      line-height: 1.4;
      word-break: break-word;
      white-space: pre-wrap;
    }
    .bubble-admin .time {
      font-size: 11px;
      color: var(--muted);
      margin-top: 6px;
      text-align: left;
    }
    .admin-reply-wrap {
      width: 100%;
      margin-top: 8px;
    }
    .reply-btn {
      margin-top: 8px;
      font-size: 12px;
      padding: 6px 10px;
      border-radius: 8px;
      border: 1px solid var(--surface-border);
      background: rgba(255, 255, 255, 0.06);
      color: var(--text);
      cursor: pointer;
    }
    .reply-inline {
      margin-top: 8px;
      display: none;
      flex-direction: column;
      gap: 6px;
    }
    .reply-inline.open { display: flex; }
    .reply-inline textarea {
      width: 100%;
      min-height: 44px;
      max-height: 100px;
      resize: vertical;
      border-radius: 10px;
      border: 1px solid var(--surface-border);
      padding: 8px 10px;
      font-size: 13px;
      background: rgba(0, 0, 0, 0.25);
      color: var(--text);
    }
    .reply-inline .reply-send {
      align-self: flex-end;
      padding: 8px 14px;
      border-radius: 10px;
      border: none;
      background: var(--accent);
      color: #fff;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
    }
    .reply-inline .reply-send:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }
    .composer-wrap {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
      background: linear-gradient(180deg, transparent, var(--bg) 18px), var(--bg);
      border-top: 1px solid var(--surface-border);
    }
    .composer {
      display: flex;
      gap: 10px;
      align-items: center;
      max-width: 375px;
      margin: 0 auto;
    }
    .composer input[type="text"] {
      flex: 1;
      min-width: 0;
      height: 44px;
      border-radius: 22px;
      border: 1px solid var(--surface-border);
      padding: 0 16px;
      font-size: 15px;
      background: var(--surface);
      color: var(--text);
    }
    .composer input::placeholder {
      color: var(--muted);
    }
    .send-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: none;
      flex-shrink: 0;
      background: var(--accent);
      color: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 10px rgba(127, 119, 221, 0.35);
    }
    .send-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      box-shadow: none;
    }
    .send-btn svg {
      width: 20px;
      height: 20px;
      display: block;
    }
    #err {
      color: var(--danger);
      font-size: 12px;
      padding: 0 12px 8px;
      min-height: 1em;
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="header-wrap">
      <div class="channel-row">
        <div class="channel-avatar" id="chAvatar" aria-hidden="true">?</div>
        <div class="channel-meta">
          <div class="channel-name" id="chName">Канал</div>
          <div class="channel-subs" id="chSubs">подписчики: —</div>
        </div>
        <div class="count-badge" id="countBadge" title="Комментариев">0</div>
      </div>
      <div class="post-preview">
        <div class="post-preview-text" id="postPreviewText">Загрузка…</div>
        <img class="post-thumb" id="postThumb" alt="" />
      </div>
    </div>
    <div id="err"></div>
    <div id="feed"></div>
    <div class="composer-wrap">
      <div class="composer">
        <input type="text" id="input" placeholder="Написать комментарий…" autocomplete="off" />
        <button type="button" class="send-btn" id="sendBtn" aria-label="Отправить" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 2L11 13" />
            <path d="M22 2L15 22L11 13L2 9L22 2Z" />
          </svg>
        </button>
      </div>
    </div>
  </div>
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var postId = params.get('post_id');
      var chatId = params.get('chat_id');
      var userId = params.get('user_id');
      var username = params.get('username') || 'Гость';
      var isAdmin = params.get('admin') === '1';
      var subscribersOverride = params.get('subscribers');

      var chAvatarEl = document.getElementById('chAvatar');
      var chNameEl = document.getElementById('chName');
      var chSubsEl = document.getElementById('chSubs');
      var countBadgeEl = document.getElementById('countBadge');
      var postPreviewTextEl = document.getElementById('postPreviewText');
      var postThumbEl = document.getElementById('postThumb');
      var feedEl = document.getElementById('feed');
      var errEl = document.getElementById('err');
      var inputEl = document.getElementById('input');
      var sendBtn = document.getElementById('sendBtn');

      var knownIds = new Set();
      var postCommentCount = null;

      function setErr(msg) {
        errEl.textContent = msg || '';
      }

      function scrollFeedToBottom() {
        feedEl.scrollTop = feedEl.scrollHeight;
      }

      function esc(s) {
        return String(s)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }

      function cssEsc(s) {
        var v = String(s);
        if (typeof CSS !== 'undefined' && typeof CSS.escape === 'function') {
          return CSS.escape(v);
        }
        return v.replace(/\\/g, '\\\\').replace(/"/g, '\\"');
      }

      function initials(name) {
        var t = String(name || '').trim();
        if (!t) return '?';
        var parts = t.split(/\s+/);
        if (parts.length >= 2) {
          return (parts[0][0] + parts[1][0]).toUpperCase();
        }
        return t.slice(0, 2).toUpperCase();
      }

      function updateBadgeFromCount(n) {
        var v = typeof n === 'number' && n >= 0 ? n : knownIds.size;
        countBadgeEl.textContent = String(v);
      }

      function setChannelHeader(title, avatarUrl) {
        var name = title && String(title).trim() ? title.trim() : 'Канал';
        chNameEl.textContent = name;
        if (subscribersOverride != null && String(subscribersOverride).trim() !== '') {
          chSubsEl.textContent = 'подписчики: ' + String(subscribersOverride).trim();
        } else {
          chSubsEl.textContent = 'подписчики: —';
        }
        if (avatarUrl) {
          chAvatarEl.innerHTML = '<img src="' + esc(avatarUrl) + '" alt="" />';
        } else {
          chAvatarEl.textContent = initials(name);
        }
      }

      function elFromHTML(html) {
        var d = document.createElement('div');
        d.innerHTML = html.trim();
        return d.firstChild;
      }

      function buildUserBlock(c) {
        var av = '<div class="user-av">' + esc(initials(c.username)) + '</div>';
        var adminPart = '';
        if (isAdmin && !c.reply) {
          adminPart =
            '<button type="button" class="reply-btn" data-toggle-reply="' +
            esc(c.comment_id) +
            '">Ответить</button>' +
            '<div class="reply-inline" data-reply-box="' +
            esc(c.comment_id) +
            '">' +
            '<textarea rows="2" placeholder="Ответ от канала…" data-reply-input="' +
            esc(c.comment_id) +
            '"></textarea>' +
            '<button type="button" class="reply-send" data-reply-send="' +
            esc(c.comment_id) +
            '">Отправить ответ</button>' +
            '</div>';
        }
        var adminBubble = '';
        if (c.reply) {
          adminBubble =
            '<div class="row-admin">' +
            '<div class="bubble-admin">' +
            '<span class="tag">от канала</span>' +
            '<div class="quote">' +
            esc(c.text) +
            '</div>' +
            '<div class="text">' +
            esc(c.reply.text) +
            '</div>' +
            '<div class="time">' +
            esc(c.reply.timestamp) +
            '</div>' +
            '</div></div>';
        }
        return (
          '<div class="comment-block" data-comment-id="' +
          esc(c.comment_id) +
          '">' +
          '<div class="row-user">' +
          av +
          '<div class="bubble-user">' +
          '<div class="name">' +
          esc(c.username) +
          '</div>' +
          '<div class="text">' +
          esc(c.text) +
          '</div>' +
          '<div class="time">' +
          esc(c.timestamp) +
          '</div>' +
          '</div></div>' +
          adminPart +
          (c.reply ? adminBubble : '<div class="admin-reply-wrap" data-admin-slot="' + esc(c.comment_id) + '"></div>') +
          '</div>'
        );
      }

      function wireAdminReply(block) {
        if (!isAdmin) return;
        var toggle = block.querySelector('.reply-btn');
        var box = block.querySelector('.reply-inline');
        var ta = box && box.querySelector('textarea');
        var send = box && box.querySelector('.reply-send');
        if (!toggle || !box || !ta || !send) return;
        toggle.addEventListener('click', function () {
          var open = box.classList.toggle('open');
          if (open) {
            ta.focus();
          }
        });
        send.addEventListener('click', function () {
          var text = ta.value.trim();
          if (!text) return;
          var cid = block.getAttribute('data-comment-id');
          if (!cid || cid.indexOf('temp-') === 0) {
            setErr('Дождитесь отправки комментария');
            return;
          }
          send.disabled = true;
          setErr('');
          fetch('/api/reply', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              comment_id: cid,
              post_id: postId,
              chat_id: Number(chatId),
              admin_text: text,
            }),
          })
            .then(function (r) {
              if (!r.ok) {
                return r.json().then(function (j) {
                  throw new Error(j.error || String(r.status));
                });
              }
              return r.json();
            })
            .then(function () {
              ta.value = '';
              box.classList.remove('open');
              return fetch('/api/comments/' + encodeURIComponent(postId)).then(function (r) {
                return r.json();
              });
            })
            .then(function (list) {
              var found = Array.isArray(list) ? list.find(function (x) { return x.comment_id === cid; }) : null;
              if (found && found.reply) {
                mergeOrUpdateComment(found);
              }
            })
            .catch(function (e) {
              setErr(e.message || String(e));
            })
            .finally(function () {
              send.disabled = false;
            });
        });
      }

      function mergeOrUpdateComment(c) {
        var existing = feedEl.querySelector(
          '.comment-block[data-comment-id="' + cssEsc(c.comment_id) + '"]'
        );
        if (!existing) {
          var node = elFromHTML(buildUserBlock(c));
          feedEl.appendChild(node);
          wireAdminReply(node);
          knownIds.add(c.comment_id);
          return;
        }
        if (c.reply) {
          var slot = existing.querySelector('[data-admin-slot]');
          if (slot && !existing.querySelector('.row-admin')) {
            var btn = existing.querySelector('.reply-btn');
            var ibox = existing.querySelector('.reply-inline');
            if (btn) btn.remove();
            if (ibox) ibox.remove();
            slot.outerHTML =
              '<div class="row-admin">' +
              '<div class="bubble-admin">' +
              '<span class="tag">от канала</span>' +
              '<div class="quote">' +
              esc(c.text) +
              '</div>' +
              '<div class="text">' +
              esc(c.reply.text) +
              '</div>' +
              '<div class="time">' +
              esc(c.reply.timestamp) +
              '</div>' +
              '</div></div>';
          }
        }
      }

      function renderInitial(list) {
        knownIds.clear();
        feedEl.innerHTML = '';
        if (!list.length) {
          feedEl.innerHTML = '<div class="feed-empty">Пока нет комментариев</div>';
          return;
        }
        var frag = document.createDocumentFragment();
        list.forEach(function (c) {
          knownIds.add(c.comment_id);
          var node = elFromHTML(buildUserBlock(c));
          frag.appendChild(node);
          wireAdminReply(node);
        });
        feedEl.appendChild(frag);
      }

      function appendNewOnly(list) {
        if (!Array.isArray(list)) return;
        var hadEmpty = !!feedEl.querySelector('.feed-empty');
        list.forEach(function (c) {
          if (knownIds.has(c.comment_id)) {
            mergeOrUpdateComment(c);
            return;
          }
          if (hadEmpty) {
            feedEl.innerHTML = '';
            hadEmpty = false;
          }
          var node = elFromHTML(buildUserBlock(c));
          feedEl.appendChild(node);
          wireAdminReply(node);
          knownIds.add(c.comment_id);
          if (typeof postCommentCount === 'number') {
            postCommentCount += 1;
            updateBadgeFromCount(postCommentCount);
          }
        });
      }

      function loadPost() {
        if (!postId) {
          setErr('Не указан post_id');
          postPreviewTextEl.textContent = '';
          return Promise.resolve();
        }
        return fetch('/api/post/' + encodeURIComponent(postId))
          .then(function (r) {
            if (!r.ok) throw new Error('Пост не найден');
            return r.json();
          })
          .then(function (p) {
            setChannelHeader(p.channel_title, p.channel_avatar_url);
            postPreviewTextEl.textContent = p.text && p.text.trim() ? p.text : '\u00a0';
            if (p.photo_url) {
              postThumbEl.src = p.photo_url;
              postThumbEl.classList.add('show');
            } else {
              postThumbEl.removeAttribute('src');
              postThumbEl.classList.remove('show');
            }
            if (typeof p.comment_count === 'number') {
              postCommentCount = p.comment_count;
              updateBadgeFromCount(postCommentCount);
            }
          })
          .catch(function (e) {
            setErr(e.message || String(e));
            postPreviewTextEl.textContent = '';
          });
      }

      function loadComments(initial) {
        if (!postId) return Promise.resolve();
        return fetch('/api/comments/' + encodeURIComponent(postId))
          .then(function (r) {
            if (!r.ok) throw new Error('Не удалось загрузить комментарии');
            return r.json();
          })
          .then(function (list) {
            var arr = Array.isArray(list) ? list : [];
            if (initial) {
              renderInitial(arr);
            } else {
              appendNewOnly(arr);
            }
            if (postCommentCount == null) {
              updateBadgeFromCount(arr.length);
            }
            scrollFeedToBottom();
          })
          .catch(function (e) {
            setErr(e.message || String(e));
          });
      }

      function bumpCommentCount(delta) {
        if (typeof postCommentCount === 'number') {
          postCommentCount += delta;
          updateBadgeFromCount(postCommentCount);
        } else {
          updateBadgeFromCount(null);
        }
      }

      function submitComment() {
        if (!postId || !chatId || !userId) {
          setErr('Нужны параметры post_id, chat_id и user_id в ссылке');
          return;
        }
        var text = inputEl.value.trim();
        if (!text) return;
        sendBtn.disabled = true;
        setErr('');
        var tempId = 'temp-' + Date.now();
        var optimistic = {
          comment_id: tempId,
          username: username,
          text: text,
          timestamp: new Date().toISOString(),
        };
        if (feedEl.querySelector('.feed-empty')) {
          feedEl.innerHTML = '';
        }
        var node = elFromHTML(buildUserBlock(optimistic));
        feedEl.appendChild(node);
        wireAdminReply(node);
        knownIds.add(tempId);
        bumpCommentCount(1);
        inputEl.value = '';
        scrollFeedToBottom();

        fetch('/api/comment', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            post_id: postId,
            chat_id: Number(chatId),
            user_id: Number(userId),
            username: username,
            text: text,
          }),
        })
          .then(function (r) {
            if (!r.ok) {
              return r.json().then(function (j) {
                throw new Error(j.error || String(r.status));
              });
            }
            return r.json();
          })
          .then(function (res) {
            knownIds.delete(tempId);
            node.setAttribute('data-comment-id', res.comment_id);
            knownIds.add(res.comment_id);
            var tEl = node.querySelector('.bubble-user .time');
            if (tEl && res.timestamp) tEl.textContent = res.timestamp;
            if (isAdmin) {
              var rep = node.querySelector('.reply-btn');
              if (rep) rep.setAttribute('data-toggle-reply', res.comment_id);
              var box = node.querySelector('.reply-inline');
              if (box) {
                box.setAttribute('data-reply-box', res.comment_id);
                var ta = box.querySelector('textarea');
                if (ta) ta.setAttribute('data-reply-input', res.comment_id);
                var sb = box.querySelector('.reply-send');
                if (sb) sb.setAttribute('data-reply-send', res.comment_id);
              }
            }
            var slot = node.querySelector('[data-admin-slot]');
            if (slot) slot.setAttribute('data-admin-slot', res.comment_id);
          })
          .catch(function (e) {
            setErr(e.message || String(e));
            knownIds.delete(tempId);
            node.remove();
            bumpCommentCount(-1);
            inputEl.value = text;
          })
          .finally(function () {
            sendBtn.disabled = !inputEl.value.trim();
            scrollFeedToBottom();
          });
      }

      sendBtn.addEventListener('click', submitComment);
      inputEl.addEventListener('input', function () {
        sendBtn.disabled = !inputEl.value.trim();
      });
      inputEl.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          if (inputEl.value.trim()) submitComment();
        }
      });

      loadPost().then(function () {
        return loadComments(true);
      });

      setInterval(function () {
        loadComments(false);
      }, 15000);
    })();
  </script>
</body>
</html>
